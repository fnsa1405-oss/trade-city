name: Escola

# Disparo manual pelo celular: aba Actions > Escola > Run workflow.
# Cada trader testa várias estratégias e tempos gráficos com dados públicos.
on:
  workflow_dispatch:
    inputs:
      trader:
        description: "Qual trader (todos, bia, edu, sol, rui, dora, teo, lena)"
        type: choice
        options: [todos, bia, edu, sol, rui, dora, teo, lena]
        default: todos
      dias:
        description: "Dias de histórico (cripto)"
        type: number
        default: 1095

permissions:
  contents: read

jobs:
  escola:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rodar a escola
        env:
          TRADER: ${{ inputs.trader }}
          DIAS: ${{ inputs.dias }}
        run: |
          python -m trade_city escola "$TRADER" --dias "$DIAS" --saida escola.md
          cat escola.md >> "$GITHUB_STEP_SUMMARY"
