name: Publicar o app

# Publica a pasta app/ no GitHub Pages: https://fnsa1405-oss.github.io/trade-city/
# O app não guarda dados: ele lê o estado.json dos branches da mesa direto do GitHub,
# então só precisa ser publicado de novo quando o próprio app muda.
# Primeira vez: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Várias frentes mexem no app: uma publicação nunca corta a outra no meio, a próxima espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Carimbar a versão (para o celular baixar a nova)
        run: sed -i "s/__VERSAO__/${GITHUB_SHA::7}/g" app/sw.js app/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      # O GitHub às vezes demora a enxergar o pacote recém-enviado ("No artifacts named
      # github-pages"). Em vez de falhar, espera e tenta de novo.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deploy
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}" >> "$GITHUB_OUTPUT"
