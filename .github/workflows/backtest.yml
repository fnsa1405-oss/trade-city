name: Backtest

# Disparo manual pelo celular: aba Actions > Backtest > Run workflow.
# Baixa candles de fontes públicas (Coinbase e Yahoo Finance): não precisa de conta em corretora.
on:
  workflow_dispatch:
    inputs:
      trader:
        description: "Qual trader testar"
        type: choice
        options: [todos, bia, teo, lena]
        default: todos
      dias:
        description: "Quantos dias de histórico"
        type: number
        default: 730

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rodar backtest
        env:
          TRADER: ${{ inputs.trader }}
          DIAS: ${{ inputs.dias }}
        run: |
          if [ "$TRADER" = "todos" ]; then lista="bia teo lena"; else lista="$TRADER"; fi
          echo "## Backtest do Trade City" >> "$GITHUB_STEP_SUMMARY"
          for t in $lista; do
            echo "Testando $t..."
            out=$(python -m trade_city backtest "$t" --dias "$DIAS" 2>&1) || out="erro ao testar $t: $(echo "$out" | tail -5)"
            echo "$out"
            printf '\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          done
