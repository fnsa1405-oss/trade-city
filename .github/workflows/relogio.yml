name: Relógio

# O agendador (cron) do GitHub nunca disparou neste repositório. O relógio faz esse papel:
# fica ligado em turnos de ~5h40, confere a agenda a cada minuto (.github/scripts/relogio.py)
# e dispara Mesa day trade, Coleta de candles, Treino dos cérebros e Escola nos horários.
# No fim de cada turno ele chama o próximo. Para religar pelo celular: Actions > Relógio >
# Run workflow. O cron abaixo fica só de reserva, caso o agendador volte a funcionar.
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: relogio
  cancel-in-progress: false

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Conferir a agenda a cada minuto
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/relogio.py 340
      - name: Chamar o próximo turno
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run relogio.yml --ref main -R "$GITHUB_REPOSITORY"
