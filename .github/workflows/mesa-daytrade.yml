name: Mesa day trade

# Day trade simulado no pregão de Nova York (9h30 às 16h), com os traders de day trade
# aprovados na escola, sempre com microcontratos futuros (MNQ, MES, MYM, M2K). A mesa olha
# o mercado a cada minuto e decide a cada candle fechado. Zera tudo antes do fechamento.
# Como um job do GitHub dura no máximo 6 horas, o pregão é dividido em duas rodadas:
# até 12h45 e de 12h45 ao fechamento. Os horários abaixo estão em UTC e cobrem o
# horário de verão e o de inverno de Nova York; rodadas repetidas esperam na fila.
# Livro e placar ficam no branch "mesa-daytrade".
on:
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "40 16 * * 1-5"
    - cron: "40 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mesa-daytrade
  cancel-in-progress: false

jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Carregar os cérebros
        run: |
          if git fetch --depth=1 origin cerebros-treinados; then
            git archive FETCH_HEAD cerebros | tar -x || echo "sem cérebros salvos"
            ls cerebros 2>/dev/null || true
          else
            echo "nenhum cérebro treinado ainda"
          fi

      - name: Abrir os candles guardados pela coleta
        # as médias longas do 60 min precisam de ~33 pregões de 1 min; o Yahoo só tem ~20
        run: |
          if git fetch --depth=1 origin dados-intraday; then
            git archive FETCH_HEAD dados | tar -x || echo "sem candles guardados"
          fi

      - name: Abrir o livro de registros
        run: |
          WT="$RUNNER_TEMP/mesa-daytrade"
          if git fetch --depth=1 origin mesa-daytrade; then
            git worktree add -B mesa-daytrade "$WT" FETCH_HEAD
            if [ -f "$WT/mesa_day.db" ]; then cp "$WT/mesa_day.db" mesa_day.db; fi
          else
            echo "Primeira rodada: livro novo."
            git worktree add --orphan -b mesa-daytrade "$WT"
          fi

      - name: Operar o pregão
        run: |
          WT="$RUNNER_TEMP/mesa-daytrade"
          AGORA=$(TZ=America/New_York date +%H%M)
          if [ "$AGORA" -lt 1240 ]; then FIM=12:45; else FIM=16:01; fi
          echo "rodada até $FIM de Nova York"
          python -m trade_city --db mesa_day.db --grupo day rodar --loop 60 --desde 09:29 --ate "$FIM" \
            --trava-git controle:trava.txt --painel estado.json > rodada.txt 2>&1 &
          PID=$!
          while kill -0 "$PID" 2>/dev/null; do
            sleep 120
            kill -0 "$PID" 2>/dev/null && [ -f estado.json ] && bash .github/scripts/salvar-mesa.sh mesa_day.db "$WT" "day trade: minuto a minuto" estado.json
          done
          STATUS=0; wait "$PID" || STATUS=$?
          cat rodada.txt
          exit $STATUS

      - name: Placar
        if: always()
        run: |
          python -m trade_city --db mesa_day.db --grupo day placar > placar.txt
          python -m trade_city --db mesa_day.db --grupo day painel --mesa day --saida estado.json
          {
            echo "## Rodada de day trade"
            echo '```'
            grep -v "^mesa rodando" rodada.txt || echo "sem operações nesta rodada"
            echo '```'
            echo "## Placar"
            echo '```'
            cat placar.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar no branch mesa-daytrade
        if: always()
        run: |
          bash .github/scripts/salvar-mesa.sh mesa_day.db "$RUNNER_TEMP/mesa-daytrade" "day trade: rodada" estado.json placar.txt
