name: Mesa simulada

# A mesa trabalha sozinha: a cada 30 minutos os traders aprovados na escola que não são de day trade
# (hoje o Rui) analisam, passam pelo gestor de risco e pelo auditor e operam
# na corretora simulada, com preços reais e dinheiro de mentira.
# O livro de registros (trade_city.db) e o placar ficam salvos no branch "mesa-dados".
# Para ver pelo celular: o app (pasta app/, publicado no GitHub Pages) lê o estado.json deste branch.
# O botão de pânico do app grava o branch "controle"; a mesa confere antes de cada rodada.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mesa
  cancel-in-progress: false

jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Carregar os cérebros
        run: |
          if git fetch --depth=1 origin cerebros-treinados; then
            git archive FETCH_HEAD cerebros | tar -x || echo "sem cérebros salvos"
            ls cerebros 2>/dev/null || true
          else
            echo "nenhum cérebro treinado ainda"
          fi

      - name: Abrir o livro de registros
        run: |
          WT="$RUNNER_TEMP/mesa-dados"
          if git fetch --depth=1 origin mesa-dados; then
            git worktree add -B mesa-dados "$WT" FETCH_HEAD
            if [ -f "$WT/trade_city.db" ]; then cp "$WT/trade_city.db" trade_city.db; fi
          else
            echo "Primeira rodada: livro novo."
            git worktree add --orphan -b mesa-dados "$WT"
          fi

      - name: Rodar a mesa
        run: |
          python -m trade_city --db trade_city.db --grupo swing rodar --trava-git controle:trava.txt | tee rodada.txt
          python -m trade_city --db trade_city.db --grupo swing placar > placar.txt
          python -m trade_city --db trade_city.db --grupo swing painel --mesa swing --saida estado.json
          {
            echo "## Rodada da mesa"
            echo '```'
            cat rodada.txt
            echo '```'
            echo "## Placar"
            echo '```'
            cat placar.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar o livro no branch mesa-dados
        run: |
          WT="$RUNNER_TEMP/mesa-dados"
          cp trade_city.db placar.txt estado.json "$WT/"
          cd "$WT"
          git config user.name "trade-city-mesa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trade_city.db placar.txt estado.json
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -q -m "mesa: rodada $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push origin mesa-dados && exit 0
            sleep $((i * 5))
          done
          exit 1
