name: Mesa simulada

# A mesa trabalha sozinha, olhando o mercado A CADA MINUTO: os traders aprovados na escola que
# não são de day trade (hoje o Rui) analisam, passam pelo gestor de risco e pelo auditor e operam
# na corretora simulada, com preços reais e dinheiro de mentira.
# O GitHub só agenda de hora em hora com segurança, então cada rodada é um turno de ~55 min
# com um ciclo por minuto. Livro e estado do app são salvos a cada 2 minutos.
# O livro de registros (trade_city.db) e o placar ficam salvos no branch "mesa-dados".
# Para ver pelo celular: o app (pasta app/, publicado no GitHub Pages) lê o estado.json deste branch.
# O botão de pânico do app grava o branch "controle"; a mesa confere antes de cada rodada.
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mesa
  cancel-in-progress: false

jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Carregar os cérebros
        run: |
          if git fetch --depth=1 origin cerebros-treinados; then
            git archive FETCH_HEAD cerebros | tar -x || echo "sem cérebros salvos"
            ls cerebros 2>/dev/null || true
          else
            echo "nenhum cérebro treinado ainda"
          fi

      - name: Abrir o livro de registros
        run: |
          WT="$RUNNER_TEMP/mesa-dados"
          if git fetch --depth=1 origin mesa-dados; then
            git worktree add -B mesa-dados "$WT" FETCH_HEAD
            if [ -f "$WT/trade_city.db" ]; then cp "$WT/trade_city.db" trade_city.db; fi
          else
            echo "Primeira rodada: livro novo."
            git worktree add --orphan -b mesa-dados "$WT"
          fi

      - name: Rodar a mesa (um ciclo por minuto)
        run: |
          WT="$RUNNER_TEMP/mesa-dados"
          MIN=${{ github.event_name == 'schedule' && 55 || 50 }}
          python -m trade_city --db trade_city.db --grupo swing rodar --loop 60 --minutos "$MIN" \
            --trava-git controle:trava.txt --painel estado.json > rodada.txt 2>&1 &
          PID=$!
          while kill -0 "$PID" 2>/dev/null; do
            sleep 120
            kill -0 "$PID" 2>/dev/null && bash .github/scripts/salvar-mesa.sh trade_city.db "$WT" "mesa: minuto a minuto" estado.json
          done
          STATUS=0; wait "$PID" || STATUS=$?
          cat rodada.txt
          exit $STATUS

      - name: Placar
        if: always()
        run: |
          python -m trade_city --db trade_city.db --grupo swing placar > placar.txt
          python -m trade_city --db trade_city.db --grupo swing painel --mesa swing --saida estado.json
          {
            echo "## Rodada da mesa"
            echo '```'
            grep -v "^mesa rodando" rodada.txt || echo "sem novidades nesta rodada"
            echo '```'
            echo "## Placar"
            echo '```'
            cat placar.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar o livro no branch mesa-dados
        if: always()
        run: |
          bash .github/scripts/salvar-mesa.sh trade_city.db "$RUNNER_TEMP/mesa-dados" "mesa: rodada" estado.json placar.txt
